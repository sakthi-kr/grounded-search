name: Continuous Integration

on:
  push:
    branches:
      - main
      - phase-1-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/search-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/search-api/go.mod

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            printf 'The following Go files are not formatted:\n%s\n' "${unformatted}"
            exit 1
          fi

      - name: Run unit tests with race detector
        run: go test -race -cover ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build search API
        run: go build ./cmd/server

  project-tool:
    name: Project tool validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            apps/search-api/go.mod
            tools/projectctl/go.mod

      - name: Test project tool
        run: go test -race -cover ./tools/projectctl/...

      - name: Build project tool
        run: go build ./tools/projectctl

  python:
    name: Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/ml-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: services/ml-service/pyproject.toml

      - name: Install service and development tools
        run: |
          python -m pip install --upgrade "pip==26.2"
          python -m pip install -e ".[dev]"
          python -m pip install "PyYAML==6.0.3"

      - name: Check formatting
        run: python -m ruff format --check src tests ../../scripts/validate_contracts.py

      - name: Run Ruff
        run: python -m ruff check src tests ../../scripts/validate_contracts.py

      - name: Run mypy
        run: python -m mypy src

      - name: Run tests with coverage
        run: python -m pytest

      - name: Validate API contracts
        working-directory: ${{ github.workspace }}
        run: python scripts/validate_contracts.py

  docker:
    name: Docker Compose verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - go
      - project-tool
      - python

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Validate Compose configuration
        run: docker compose -f deploy/docker-compose/compose.yaml config --quiet

      - name: Build and verify Compose environment
        run: python scripts/verify_compose.py

      - name: Show Docker diagnostics after failure
        if: failure()
        run: |
          docker ps -a
          docker images
