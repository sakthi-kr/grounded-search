name: grounded-search

services:
  ml-service:
    build:
      context: ../..
      dockerfile: services/ml-service/Dockerfile
    image: grounded-search/ml-service:phase1
    environment:
      GROUNDEDSEARCH_ENV: development
      LOG_LEVEL: INFO
      ML_SERVICE_HOST: 0.0.0.0
      ML_SERVICE_PORT: "8090"
    ports:
      - "${ML_SERVICE_HOST_PORT:-8090}:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8090/healthz',
          timeout=2
          ).read()
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  search-api:
    build:
      context: ../..
      dockerfile: apps/search-api/Dockerfile
      args:
        VERSION: phase1
    image: grounded-search/search-api:phase1
    environment:
      LOG_LEVEL: INFO
      SEARCH_API_HOST: 0.0.0.0
      SEARCH_API_PORT: "8080"
      SEARCH_API_READ_HEADER_TIMEOUT: 5s
      SEARCH_API_READ_TIMEOUT: 10s
      SEARCH_API_WRITE_TIMEOUT: 15s
      SEARCH_API_IDLE_TIMEOUT: 60s
      SEARCH_API_SHUTDOWN_TIMEOUT: 10s
      ML_SERVICE_URL: http://ml-service:8090
      ML_SERVICE_TIMEOUT: 2s
    ports:
      - "${SEARCH_API_HOST_PORT:-8080}:8080"
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:8080/healthz
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
